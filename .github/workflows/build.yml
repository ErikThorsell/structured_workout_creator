# Build the static SPA into an nginx image and publish it to GHCR. The homelab cluster pulls a PINNED tag
# (never :latest) per repo convention, so images are cut from git tags: push `v1.2.3` -> publishes
# ghcr.io/erikthorsell/structured_workout_creator:1.2.3 (+ :1.2 and :1). Bump the tag in the homelab
# Deployment to roll a new version. `workflow_dispatch` allows a manual rebuild of the current ref.
name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/structured_workout_creator

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags from the git ref: a semver tag `vX.Y.Z` -> X.Y.Z, X.Y, X. No :latest (pinned deploys only).
      - name: Derive image tags
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
