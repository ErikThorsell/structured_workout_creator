# Complete nginx configuration for the Chainguard nginx image, run as a non-root user on a read-only
# root filesystem: every writable path is under /tmp, and logs go to the container's stdout/stderr.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # SPA fallback -- serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache hashed assets aggressively (Vite adds content hashes to filenames)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        # Do not cache index.html itself
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/security-headers.conf;
        }
    }
}
